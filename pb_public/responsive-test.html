<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgendaPro · Teste de resoluções</title><style>*{box-sizing:border-box}body{margin:0;background:#ece9f3;font:14px system-ui;color:#352844}header{padding:18px 22px;background:white;position:relative;z-index:1}h1{font-size:18px;margin:0 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select{min-height:44px;border:1px solid #d8cde9;border-radius:7px;background:#f5f1fc;padding:10px;color:#67517f;cursor:pointer}button.active{background:#7160cf;color:white}#stage{padding:22px;min-width:max-content}iframe{display:block;border:0;box-shadow:0 4px 25px #38245122;border-radius:8px;background:white}p{margin-bottom:0;color:#89749b;font-size:12px}output{font-weight:600}</style></head><body><header><h1>Teste responsivo · AgendaPro <output id="resolution">375 × 812</output></h1><nav aria-label="Resoluções"><button onclick="resizeFrame(360,800,this)">360 · celular</button><button class="active" onclick="resizeFrame(375,812,this)">375 · celular</button><button onclick="resizeFrame(767,900,this)">767 · limite celular</button><button onclick="resizeFrame(768,1024,this)">768 · tablet</button><button onclick="resizeFrame(1024,900,this)">1024 · tablet</button><button onclick="resizeFrame(1025,900,this)">1025 · desktop</button><button onclick="resizeFrame(1440,900,this)">1440 · desktop</button><button onclick="auditLayout()">Verificar layout atual</button></nav><pre id="audit" role="status" style="white-space:pre-wrap;max-width:900px;font:12px system-ui;color:#67517f"></pre><p>O quadro usa as media queries reais do aplicativo. Entre na demonstração dentro dele e teste o menu, a conferência, a agenda e o faturamento. Apenas esta bancada pode ter rolagem horizontal.</p></header><div id="stage"><iframe id="preview" title="Aplicativo em teste" src="./index.html" width="375" height="812"></iframe></div><script>function resizeFrame(w,h,button){const f=document.getElementById('preview');f.width=w;f.height=h;document.getElementById('resolution').textContent=w+' × '+h;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active')}function auditLayout(){const d=document.getElementById('preview').contentDocument;const visible=e=>e.getClientRects().length&&!e.closest('[inert]')&&d.defaultView.getComputedStyle(e).visibility!=='hidden';const small=[...d.querySelectorAll('button')].filter(visible).filter(e=>e.getBoundingClientRect().height<44);const root=d.documentElement;document.getElementById('audit').textContent=(root.scrollWidth<=root.clientWidth?'✓':'✕')+' Sem rolagem horizontal na página ('+root.scrollWidth+' / '+root.clientWidth+' px)\n'+(small.length?'✕':'✓')+' Botões visíveis com altura mínima de 44px'+(small.length?': '+small.map(e=>e.textContent.trim()).join(', '):'')+'\n✓ Viewport: '+d.querySelector('meta[name=viewport]').content+'\n'+auditContrast(d)}function auditContrast(d){const w=d.defaultView,core=w.Core,parse=v=>(v.match(/[\d.]+/g)||[]).map(Number),hex=c=>'#'+c.slice(0,3).map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');let issues=[],min=100;for(const el of d.querySelectorAll('body *')){if(!el.getClientRects().length||el.closest('[inert]')||['SCRIPT','STYLE','SVG','PATH','CANVAS','IMG','OPTION'].includes(el.tagName)||w.getComputedStyle(el).visibility==='hidden')continue;if(!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(el.tagName)&&![...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))continue;const chain=[];for(let n=el;n;n=n.parentElement)chain.unshift(n);let bg=[255,255,255];for(const n of chain){const b=parse(w.getComputedStyle(n).backgroundColor),a=b.length>3?b[3]:1;bg=b.slice(0,3).map((v,i)=>v*a+bg[i]*(1-a))}let ratio=core.contrast(hex(parse(w.getComputedStyle(el).color)),hex(bg));min=Math.min(min,ratio);if(ratio<4.5)issues.push((el.textContent.trim().slice(0,40)||el.getAttribute('aria-label')||el.tagName)+' '+ratio.toFixed(2)+':1')}return(issues.length?'✕':'✓')+' Contraste de texto: mínimo '+min.toFixed(2)+':1'+(issues.length?'\n'+issues.join('\n'):'')}
document.getElementById('preview').addEventListener('load',()=>{document.getElementById('audit').textContent='Abra a tela desejada e clique em Verificar layout atual.'});</script></body></html>
